<svg xmlns="http://www.w3.org/2000/svg" width="600" height="430" viewBox="0 0 600 430"
     font-family="'Source Sans 3'" font-size="16">
  <title>The pond's food web: an arrow from X to Y is the fact eats X Y</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- level bands -->
  <rect x="0" y="22" width="600" height="56" fill="#E6E6E6"/>
  <rect x="0" y="242" width="600" height="56" fill="#E6E6E6"/>
  <text x="10" y="16" font-size="15" fill="#4D4D4D">top of the food chain</text>
  <text x="10" y="424" font-size="15" fill="#4D4D4D">bottom: a plant, it eats nothing</text>

  <!-- edges: eater above, eaten below -->
  <g stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="190" y1="68" x2="132" y2="140"/>   <!-- heron frog -->
    <line x1="230" y1="68" x2="308" y2="140"/>   <!-- heron fish -->
    <line x1="440" y1="68" x2="344" y2="140"/>   <!-- otter fish -->
    <line x1="110" y1="178" x2="168" y2="250"/>  <!-- frog fly -->
    <line x1="150" y1="178" x2="342" y2="252"/>  <!-- frog snail -->
    <line x1="300" y1="178" x2="208" y2="252"/>  <!-- fish fly -->
    <line x1="340" y1="178" x2="372" y2="250"/>  <!-- fish snail -->
    <line x1="510" y1="178" x2="420" y2="250"/>  <!-- duck snail -->
    <path d="M 550 178 Q 590 380 350 382"/>      <!-- duck algae -->
    <line x1="190" y1="288" x2="276" y2="362"/>  <!-- fly algae -->
    <line x1="380" y1="288" x2="318" y2="362"/>  <!-- snail algae -->
  </g>

  <!-- nodes -->
  <g font-family="'JuliaMono'" font-size="16" text-anchor="middle">
    <rect x="160" y="32" width="96" height="36" rx="18" fill="#FFFFFF" stroke="#E8480A" stroke-width="2.5"/>
    <text x="208" y="55">heron</text>
    <rect x="392" y="32" width="96" height="36" rx="18" fill="#FFFFFF" stroke="#E8480A" stroke-width="2.5"/>
    <text x="440" y="55">otter</text>

    <rect x="72" y="142" width="96" height="36" rx="18" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="120" y="165">frog</text>
    <rect x="272" y="142" width="96" height="36" rx="18" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="320" y="165">fish</text>
    <rect x="482" y="142" width="96" height="36" rx="18" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="530" y="165">duck</text>

    <rect x="142" y="252" width="96" height="36" rx="18" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="190" y="275">fly</text>
    <rect x="338" y="252" width="96" height="36" rx="18" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="386" y="275">snail</text>

    <rect x="252" y="364" width="96" height="36" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="300" y="387">algae</text>
  </g>
</svg>
